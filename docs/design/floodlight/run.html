<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Floodlight · Run</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        background: #101214;
      }
      a {
        color: #c4d39b;
      }
      a:hover {
        color: #dbe6bf;
      }
      .d {
        font-family: 'Bricolage Grotesque', sans-serif;
      }
      .tile {
        background: #1a1d20;
        border-radius: 22px;
        padding: 16px;
        box-sizing: border-box;
      }
      .lbl {
        font-size: 12.5px;
        font-weight: 600;
        color: #8e918f;
      }
      .tab {
        width: 44px;
        height: 44px;
        border-radius: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #8e918f;
      }
      .wk {
        flex: 1;
        background: rgba(138, 160, 191, 0.22);
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div style="width: 390px; height: 844px; box-sizing: border-box; background: #101214; color: #ebe9e4; font-family: 'Manrope', sans-serif; position: relative; overflow: hidden">
      <div style="padding: 58px 16px 0; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; flex-direction: column; gap: 2px; margin-bottom: 6px">
          <span class="lbl">28 runs since August</span>
          <h1 class="d" style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Run</h1>
        </div>

        <div style="background: #1d232c; border-radius: 26px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; justify-content: space-between; align-items: center">
            <span style="font-size: 13px; font-weight: 700; color: #93a6c2">This week</span
            ><span style="font-size: 12.5px; font-weight: 700; color: #93a6c2; background: rgba(138, 160, 191, 0.12); padding: 4px 10px; border-radius: 999px">Usually 23 km</span>
          </div>
          <span class="d" style="font-size: 64px; font-weight: 800; line-height: 0.9; letter-spacing: -0.04em; color: #c9d6ea"
            >14.6<span style="font-size: 20px; font-weight: 600; letter-spacing: 0; color: #93a6c2"> km</span></span
          >
          <div style="height: 8px; background: rgba(138, 160, 191, 0.16); border-radius: 4px; overflow: hidden">
            <div style="width: 63%; height: 100%; background: #8aa0bf; border-radius: 4px"></div>
          </div>
          <div style="display: flex; gap: 4px; align-items: flex-end; height: 40px; margin-top: 4px">
            <div class="wk" style="height: 22px"></div>
            <div class="wk" style="height: 28px"></div>
            <div class="wk" style="height: 16px"></div>
            <div class="wk" style="height: 30px"></div>
            <div class="wk" style="height: 26px"></div>
            <div class="wk" style="height: 20px"></div>
            <div class="wk" style="height: 32px"></div>
            <div class="wk" style="height: 40px; background: #8aa0bf"></div>
            <div class="wk" style="height: 24px"></div>
            <div class="wk" style="height: 19px"></div>
            <div class="wk" style="height: 29px"></div>
            <div class="wk" style="height: 15px; background: #c9d6ea"></div>
          </div>
          <span style="font-size: 13px; font-weight: 600; color: #a7b3c4">33 km was your biggest week in 3 months</span>
        </div>

        <div class="tile" style="display: flex; flex-direction: column; gap: 6px">
          <span class="lbl">Fitness · pace at an easy 145 bpm</span>
          <div style="display: flex; align-items: baseline; gap: 10px">
            <span class="d" style="font-size: 40px; font-weight: 700; letter-spacing: -0.03em; line-height: 1"
              >5:35<span style="font-size: 14px; color: #8e918f; font-family: 'Manrope'"> /km</span></span
            ><span style="font-size: 12.5px; font-weight: 700; color: #a3c4a9; background: rgba(163, 196, 169, 0.12); padding: 3px 9px; border-radius: 999px">6 s quicker</span>
          </div>
          <svg width="326" height="56" viewBox="0 0 326 56" role="img" aria-label="Easy pace trend since September, getting quicker">
            <path d="M4 44C70 42 120 36 180 30S280 16 320 10" fill="none" stroke="#8aa0bf" stroke-width="2.5" stroke-linecap="round"></path>
            <circle cx="320" cy="10" r="5" fill="#ebe9e4"></circle>
          </svg>
        </div>

        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
          <div class="tile" style="padding: 14px; display: flex; flex-direction: column; gap: 4px">
            <span class="lbl">1 km</span><span class="d" style="font-size: 24px; font-weight: 700; letter-spacing: -0.02em">3:58</span
            ><span style="font-size: 11.5px; color: #8e918f">2 Oct</span>
          </div>
          <div class="tile" style="padding: 14px; display: flex; flex-direction: column; gap: 4px; background: #252b20">
            <span style="font-size: 12.5px; font-weight: 700; color: #c4d39b">5 km · new</span
            ><span class="d" style="font-size: 24px; font-weight: 800; letter-spacing: -0.02em; color: #d5e2ad">22:41</span
            ><span style="font-size: 11.5px; color: #a9b58a">7 Nov parkrun</span>
          </div>
          <div class="tile" style="padding: 14px; display: flex; flex-direction: column; gap: 4px">
            <span class="lbl">10 km</span><span class="d" style="font-size: 24px; font-weight: 700; letter-spacing: -0.02em">47:52</span
            ><span style="font-size: 11.5px; color: #8e918f">13 Sep</span>
          </div>
        </div>
      </div>

      <nav
        style="
          position: absolute;
          left: 50%;
          transform: translateX(-50%);
          bottom: 26px;
          height: 60px;
          background: #23272b;
          border-radius: 30px;
          display: flex;
          align-items: center;
          gap: 4px;
          padding: 0 8px;
          box-sizing: border-box;
        "
      >
        <a href="#" class="tab" aria-label="Today"
          ><svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="M11 6v5l3 2" stroke-linecap="round"></path></svg
        ></a>
        <a href="#" class="tab" style="background: #ebe9e4; color: #101214; width: auto; padding: 0 16px; gap: 8px; text-decoration: none; font-weight: 700; font-size: 14px"
          ><svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="3" y="5" width="16" height="12" rx="6"></rect>
            <rect x="7" y="8.5" width="8" height="5" rx="2.5"></rect></svg
          >Run</a
        >
        <a href="#" class="tab" aria-label="Football"
          ><svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="M11 7l3.5 2.5-1.3 4h-4.4l-1.3-4z"></path></svg
        ></a>
        <a href="#" class="tab" aria-label="Lift"
          ><svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M2 11h18M5 7v8M8 6v10M14 6v10M17 7v8"></path></svg
        ></a>
        <a href="#" class="tab" aria-label="Body"
          ><svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12h4l2-5 3 9 2-6 1.5 2H20"></path></svg
        ></a>
      </nav>
    </div>
  </body>
</html>
