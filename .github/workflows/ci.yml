# Checks every pull request, and puts a preview of it on Netlify.
# `check` is the status main's ruleset requires before anything merges.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run check:env
      - run: npm test
      - run: npm run build

  preview:
    needs: check
    # previews need the Netlify token, which forks and Dependabot don't get
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && vars.NETLIFY_SITE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # no functions: a preview shows sample data and can't reach your real data or Garmin
      - name: Deploy a preview
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          PR: ${{ github.event.number }}
        run: |
          mkdir -p "$RUNNER_TEMP/no-functions"
          npx --yes netlify-cli@27.14.2 deploy --no-build --dir dist --functions "$RUNNER_TEMP/no-functions" --alias "pr-$PR" --message "PR #$PR" --json > "$RUNNER_TEMP/deploy.json"
          echo "url=$(jq -r .deploy_url "$RUNNER_TEMP/deploy.json")" >> "$GITHUB_OUTPUT"
