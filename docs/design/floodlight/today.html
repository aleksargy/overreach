<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Floodlight · Today</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        background: #101214;
      }
      a {
        color: #c4d39b;
      }
      a:hover {
        color: #dbe6bf;
      }
      .d {
        font-family: 'Bricolage Grotesque', sans-serif;
      }
      .tile {
        background: #1a1d20;
        border-radius: 22px;
        padding: 16px;
        box-sizing: border-box;
      }
      .lbl {
        font-size: 12.5px;
        font-weight: 600;
        color: #8e918f;
      }
      .tab {
        width: 44px;
        height: 44px;
        border-radius: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #8e918f;
      }
      .dot {
        width: 34px;
        height: 34px;
        border-radius: 17px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 800;
      }
      .dc {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .stat {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
    </style>
  </head>
  <body>
    <div style="width: 390px; height: 844px; box-sizing: border-box; background: #101214; color: #ebe9e4; font-family: 'Manrope', sans-serif; position: relative; overflow: hidden">
      <div style="padding: 58px 16px 0; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px">
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span class="lbl">Friday 13 Nov</span>
            <h1 class="d" style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Evening, Alex</h1>
          </div>
          <div style="display: flex; gap: 8px">
            <button
              aria-label="Log"
              style="
                width: 40px;
                height: 40px;
                border-radius: 20px;
                border: 0;
                background: #ebe9e4;
                color: #101214;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 0;
              "
            >
              <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>
              </svg>
            </button>
            <button
              aria-label="Settings"
              style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: #23272b; color: #ebe9e4; font: 700 14px 'Manrope'; padding: 0"
            >
              A
            </button>
          </div>
        </div>

        <div style="background: #252b20; border-radius: 26px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
          <div style="display: flex; justify-content: space-between; align-items: center">
            <span style="font-size: 13px; font-weight: 700; color: #a9b58a">This week</span>
            <span style="font-size: 12.5px; font-weight: 700; color: #a9b58a">Load 1043 · usually 1182</span>
          </div>
          <span class="d" style="font-size: 44px; font-weight: 800; line-height: 0.95; letter-spacing: -0.035em; font-stretch: 85%; color: #d5e2ad"
            >4 sessions,<br />14.6 km run</span
          >
          <div style="display: flex; justify-content: space-between">
            <div class="dc"><span class="dot" style="background: #8aa0bf; color: #101214">R</span><span class="lbl" style="color: #a9b58a">M</span></div>
            <div class="dc"><span class="dot" style="background: #c4d39b; color: #101214">7s</span><span class="lbl" style="color: #a9b58a">T</span></div>
            <div class="dc"><span class="dot" style="background: #a99fc4; color: #101214">L</span><span class="lbl" style="color: #a9b58a">W</span></div>
            <div class="dc"><span class="dot" style="background: #8aa0bf; color: #101214">R</span><span class="lbl" style="color: #a9b58a">T</span></div>
            <div class="dc"><span class="dot" style="border: 2px solid #d5e2ad; box-sizing: border-box"></span><span class="lbl" style="color: #d5e2ad">F</span></div>
            <div class="dc"><span class="dot" style="background: rgba(196, 211, 155, 0.1)"></span><span class="lbl" style="color: #a9b58a">S</span></div>
            <div class="dc">
              <span class="dot" style="border: 2px dashed #c4d39b; box-sizing: border-box; color: #c4d39b">11s</span><span class="lbl" style="color: #a9b58a">S</span>
            </div>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <div class="tile" style="display: flex; flex-direction: column; gap: 8px; min-height: 150px; background: #1d232c">
            <span class="lbl" style="color: #93a6c2">Next game</span>
            <span class="d" style="font-size: 24px; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em">Sunday 10:30</span>
            <span style="font-size: 13px; color: #a7b3c4">11-a-side</span>
            <span style="font-size: 13px; font-weight: 600; margin-top: auto">Last: W 3–1 · <span style="color: #a3c4a9">7.4</span></span>
          </div>
          <div class="tile" style="display: flex; flex-direction: column; gap: 8px; min-height: 150px">
            <span class="lbl">Weight</span>
            <span class="d" style="font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -0.03em"
              >75.5<span style="font-size: 14px; color: #8e918f; font-family: 'Manrope'"> kg</span></span
            >
            <span style="font-size: 13px; font-weight: 600; color: #c4d39b; margin-top: auto">Lightest in 3 months</span>
          </div>
        </div>

        <div class="tile" style="display: flex; gap: 14px; align-items: center">
          <svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true" style="flex: none; background: #1d232c; border-radius: 16px">
            <path
              d="M14 46C10 34 16 20 28 16s26 2 24 16-14 20-24 18-12-8-14-4"
              fill="none"
              stroke="#8aa0bf"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            ></path>
            <circle cx="14" cy="46" r="3" fill="#ebe9e4"></circle>
          </svg>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
            <div style="display: flex; justify-content: space-between"><span style="font-size: 15px; font-weight: 700">Easy run</span><span class="lbl">Yesterday</span></div>
            <div style="display: flex; gap: 16px">
              <div class="stat">
                <span class="d" style="font-size: 20px; font-weight: 700">8.2<span style="font-size: 12px; color: #8e918f; font-family: 'Manrope'"> km</span></span>
              </div>
              <div class="stat">
                <span class="d" style="font-size: 20px; font-weight: 700">5:38<span style="font-size: 12px; color: #8e918f; font-family: 'Manrope'"> /km</span></span>
              </div>
              <div class="stat">
                <span class="d" style="font-size: 20px; font-weight: 700">142<span style="font-size: 12px; color: #8e918f; font-family: 'Manrope'"> bpm</span></span>
              </div>
            </div>
          </div>
        </div>
        <a href="#" style="align-self: center; font-size: 13px; font-weight: 600; color: #8e918f; text-decoration: none; padding: 4px">All activity ›</a>
      </div>

      <nav
        style="
          position: absolute;
          left: 50%;
          transform: translateX(-50%);
          bottom: 26px;
          height: 60px;
          background: #23272b;
          border-radius: 30px;
          display: flex;
          align-items: center;
          gap: 4px;
          padding: 0 8px;
          box-sizing: border-box;
        "
      >
        <a href="#" class="tab" style="background: #ebe9e4; color: #101214; width: auto; padding: 0 16px; gap: 8px; text-decoration: none; font-weight: 700; font-size: 14px"
          ><svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="M11 6v5l3 2" stroke-linecap="round"></path></svg
          >Today</a
        >
        <a href="#" class="tab" aria-label="Run"
          ><svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="3" y="5" width="16" height="12" rx="6"></rect>
            <rect x="7" y="8.5" width="8" height="5" rx="2.5"></rect></svg
        ></a>
        <a href="#" class="tab" aria-label="Football"
          ><svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="M11 7l3.5 2.5-1.3 4h-4.4l-1.3-4z"></path></svg
        ></a>
        <a href="#" class="tab" aria-label="Lift"
          ><svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M2 11h18M5 7v8M8 6v10M14 6v10M17 7v8"></path></svg
        ></a>
        <a href="#" class="tab" aria-label="Body"
          ><svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12h4l2-5 3 9 2-6 1.5 2H20"></path></svg
        ></a>
      </nav>
    </div>
  </body>
</html>
