<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Floodlight · Lift</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        background: #101214;
      }
      a {
        color: #c4d39b;
      }
      a:hover {
        color: #dbe6bf;
      }
      .d {
        font-family: 'Bricolage Grotesque', sans-serif;
      }
      .tile {
        background: #1a1d20;
        border-radius: 22px;
        padding: 16px;
        box-sizing: border-box;
      }
      .lbl {
        font-size: 12.5px;
        font-weight: 600;
        color: #8e918f;
      }
      .tab {
        width: 44px;
        height: 44px;
        border-radius: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #8e918f;
      }
      .ex {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 9px 0;
        border-top: 1px solid rgba(169, 159, 196, 0.14);
      }
      .exn {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .chip {
        flex: none;
        height: 36px;
        padding: 0 14px;
        border-radius: 999px;
        background: #1a1d20;
        border: 0;
        color: #ebe9e4;
        font: 600 13.5px 'Manrope';
        display: flex;
        align-items: center;
      }
      .pr {
        display: grid;
        grid-template-columns: 1fr 70px 92px;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
        border-top: 1px solid #23272b;
      }
    </style>
  </head>
  <body>
    <div style="width: 390px; height: 844px; box-sizing: border-box; background: #101214; color: #ebe9e4; font-family: 'Manrope', sans-serif; position: relative; overflow: hidden">
      <div style="padding: 58px 16px 0; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px">
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span class="lbl">10 sessions in 4 weeks</span>
            <h1 class="d" style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Lift</h1>
          </div>
          <button
            aria-label="New workout"
            style="
              width: 40px;
              height: 40px;
              border-radius: 20px;
              border: 0;
              background: #ebe9e4;
              color: #101214;
              display: flex;
              align-items: center;
              justify-content: center;
              padding: 0;
            "
          >
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path>
            </svg>
          </button>
        </div>

        <div style="background: #221f2a; border-radius: 26px; padding: 18px; display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; justify-content: space-between; align-items: center">
            <span style="font-size: 13px; font-weight: 700; color: #b3abcf">Next up</span>
            <span style="font-size: 12.5px; font-weight: 600; color: #b3abcf">Last done 12 days ago</span>
          </div>
          <span class="d" style="font-size: 44px; font-weight: 800; line-height: 1; letter-spacing: -0.035em; color: #ddd6ee; margin-top: 4px">Calisthenics</span>
          <span style="font-size: 13px; color: #b9b3c9; margin-bottom: 10px">Back, legs and chest</span>
          <div class="ex">
            <div class="exn"><span style="font-size: 15px; font-weight: 700">Weighted pull-up</span><span style="font-size: 12px; color: #b9b3c9">3 sets · +1 rep</span></div>
            <span class="d" style="font-size: 18px; font-weight: 700; color: #ddd6ee">+7.5 kg × 8</span>
          </div>
          <div class="ex">
            <div class="exn"><span style="font-size: 15px; font-weight: 700">Pistol squat</span><span style="font-size: 12px; color: #b9b3c9">3 sets · +1 rep</span></div>
            <span class="d" style="font-size: 18px; font-weight: 700; color: #ddd6ee">6 reps</span>
          </div>
          <div class="ex">
            <div class="exn"><span style="font-size: 15px; font-weight: 700">Dip</span><span style="font-size: 12px; color: #b9b3c9">3 sets · +2.5 kg</span></div>
            <span class="d" style="font-size: 18px; font-weight: 700; color: #ddd6ee">+10 kg × 8</span>
          </div>

          <button style="margin-top: 10px; height: 50px; border-radius: 999px; border: 0; background: #cbc3e6; color: #17141f; font: 800 15px 'Manrope'">Start workout</button>
        </div>

        <div style="display: flex; gap: 8px; overflow: hidden; white-space: nowrap; margin-right: -16px">
          <button class="chip">Push A</button>
          <button class="chip">Pull A</button>
          <button class="chip">Legs A</button>
          <button class="chip" style="background: #221f2a; color: #ddd6ee">Calisthenics</button>
          <button class="chip" style="background: none; border: 1.5px dashed #3a3f44; color: #8e918f">+ New</button>
        </div>

        <div class="tile" style="display: flex; flex-direction: column; padding-bottom: 8px">
          <span class="lbl" style="margin-bottom: 6px">Progress · last 8 weeks</span>
          <div class="pr">
            <span style="font-size: 14.5px; font-weight: 700">Bench press</span
            ><svg width="70" height="22" viewBox="0 0 70 22" aria-hidden="true">
              <path d="M1 19H18V14H38V9H56V4H69" fill="none" stroke="#a99fc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
            <div style="display: flex; flex-direction: column; align-items: flex-end">
              <span class="d" style="font-size: 17px; font-weight: 700">80 kg</span><span style="font-size: 11.5px; font-weight: 700; color: #a3c4a9">+5 kg</span>
            </div>
          </div>
          <div class="pr">
            <span style="font-size: 14.5px; font-weight: 700">Back squat</span
            ><svg width="70" height="22" viewBox="0 0 70 22" aria-hidden="true">
              <path d="M1 19H12V15H30V11H46V7H60V3H69" fill="none" stroke="#a99fc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
            <div style="display: flex; flex-direction: column; align-items: flex-end">
              <span class="d" style="font-size: 17px; font-weight: 700">100 kg</span><span style="font-size: 11.5px; font-weight: 700; color: #a3c4a9">+7.5 kg</span>
            </div>
          </div>
        </div>
      </div>

      <nav
        style="
          position: absolute;
          left: 50%;
          transform: translateX(-50%);
          bottom: 26px;
          height: 60px;
          background: #23272b;
          border-radius: 30px;
          display: flex;
          align-items: center;
          gap: 4px;
          padding: 0 8px;
          box-sizing: border-box;
        "
      >
        <a href="#" class="tab" aria-label="Today"
          ><svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="M11 6v5l3 2" stroke-linecap="round"></path></svg
        ></a>
        <a href="#" class="tab" aria-label="Run"
          ><svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="3" y="5" width="16" height="12" rx="6"></rect>
            <rect x="7" y="8.5" width="8" height="5" rx="2.5"></rect></svg
        ></a>
        <a href="#" class="tab" aria-label="Football"
          ><svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="M11 7l3.5 2.5-1.3 4h-4.4l-1.3-4z"></path></svg
        ></a>
        <a href="#" class="tab" style="background: #ebe9e4; color: #101214; width: auto; padding: 0 16px; gap: 8px; text-decoration: none; font-weight: 700; font-size: 14px"
          ><svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M2 11h18M5 7v8M8 6v10M14 6v10M17 7v8"></path></svg
          >Lift</a
        >
        <a href="#" class="tab" aria-label="Body"
          ><svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12h4l2-5 3 9 2-6 1.5 2H20"></path></svg
        ></a>
      </nav>
    </div>
  </body>
</html>
